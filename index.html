        } else {
          estIntegrations.push(id);
        }
        render();
      };

      window.__submitContact = function(e) {
        e.preventDefault();
        const name = document.getElementById('contactName').value;
        const email = document.getElementById('contactEmail').value;
        const subj = document.getElementById('contactSubj').value;
        const msg = document.getElementById('contactMsg').value;
        
        const mailtoUrl = "mailto:" + profile.email + "?subject=" + encodeURIComponent(subj || 'Portfolio Inquiry') + "&body=" + encodeURIComponent("Name: " + name + "\nEmail: " + email + "\n\nMessage:\n" + msg);
        window.location.href = mailtoUrl;
        contactModalOpen = false;
        render();
      };

      // Initial Mount
      render();
    })();
  </script>
</body>
</html>
