  <script>
    window.__BLOG_DATA__ = {"profile":{"name":"Hamid Ali Asad","title":"Websites & Automation Specialist","headline":"Hi — I’m Hamid Ali Asad","subheading":"I build websites and automate workflows for businesses that need things done right the first time. 50+ sites delivered across Australia, UK, and the US — WordPress, WooCommerce, Webflow, and custom integrations with AI tools, Make, and Zapier.","email":"hamidaliasad16@gmail.com","location":"Available Globally (AU, UK, US timezone aligned)","availability":"Available for new projects & retainers","stats":{"projectsDelivered":"50+","regionsCovered":"Australia, UK, US","satisfactionRate":"99.4%","uptimeAverage":"99.98%"},"specialties":["WordPress & WooCommerce","Webflow Development","Make & Zapier Automations","AI Integrations & LLMs","High-Speed Site Migrations","CRM & Database Sync","Custom PHP / API Pipelines","Performance Optimization"],"socials":{"github":"https://github.com","linkedin":"https://linkedin.com","resumeUrl":"#","email":"mailto:hamidaliasad16@gmail.com"}},"posts":[{"id":"geo-aeo-generative-engine-optimization-guide","slug":"geo-aeo-generative-engine-optimization-guide","title":"GEO & AEO in 2026: How to Optimize Your Website for Perplexity, ChatGPT Search, and Google AI Overviews","metaTitle":"GEO & AEO Guide 2026: Rank on Perplexity & AI Search | Hamid Ali Asad","metaDescription":"Complete technical framework for Generative Engine Optimization (GEO) and Answer Engine Optimization (AEO) to capture high-value direct clients from AI search engines.","category":"GEO & AEO Strategy","date":"February 2026","readTime":"6 min read","author":"Hamid Ali Asad","targetAudience":"Business Owners, Agencies, & Founders seeking direct client acquisition via AI search","featured":true,"geoDirectAnswer":"Generative Engine Optimization (GEO) and Answer Engine Optimization (AEO) are the engineering practices of structuring web content so Large Language Models (LLMs like ChatGPT, Perplexity, Gemini, and Claude) cite and recommend your business. Unlike traditional SEO focusing on keyword density and backlinks, GEO requires high information gain, explicit entity disambiguation, 40-to-60-word authoritative direct answer blocks, verified author schemas, and clean machine-readable HTML markup.","keyTakeaways":["Traditional keyword stuffing fails in AI search; LLMs prioritize Information Gain and cited consensus.","AEO requires concise, definitive 40–60 word answer summaries immediately under primary H2 headings.","Entity authority must be proven through Schema.org (Person, Organization, ItemList, FAQPage).","Direct conversion hooks embedded alongside architectural blueprints turn AI referrals into paid inquiries.","Sites with sub-400ms TTFB and semantic HTML are scraped and ingested 3.8x faster by AI web crawlers."],"contentMarkdown":"### The Death of the 10 Blue Links\nFor twenty years, web traffic was governed by a predictable formula: research keywords, write 1,500 words, build backlinks, and compete for a spot in Google's ten organic blue links.\n\nIn 2026, user behavior has fundamentally shifted. High-intent decision makers (founders, executives, procurement managers) are no longer clicking through pages of search ads. Instead, they query **Perplexity**, **ChatGPT Search**, and **Google AI Overviews (SGE)** with complex, multi-variable prompts:\n\n> *\"Recommend the top website and workflow automation specialists who work with Australian and US service companies, with verified case studies and fast turnaround.\"*\n\nIf your website is not engineered for **GEO (Generative Engine Optimization)** and **AEO (Answer Engine Optimization)**, your business is invisible to this new wave of clients.\n\n---\n\n### Understanding the GEO & AEO Hierarchy\n\n| Dimension | Traditional SEO | Generative Engine Optimization (GEO) | Answer Engine Optimization (AEO) |\n| :--- | :--- | :--- | :--- |\n| **Primary Audience** | Search crawler bots (Googlebot) | LLM Synthesizers (Perplexity, GPT-4o) | Voice agents & Featured Snippet boxes |\n| **Optimization Focus** | Keyword density & backlinks | Entity authority, factual density, information gain | Concise, zero-fluff, direct question answers |\n| **Core Metric** | Organic impressions & rank | LLM Citation share & recommendation frequency | Position Zero & conversational answers |\n| **Conversion Vector** | Generic landing page forms | In-context problem validation & fast consultation CTAs | Direct contact link & verified credibility stats |\n\n---\n\n### The 5 Architectural Pillars of GEO for Direct Client Acquisition\n\n#### 1. The \"Direct Answer Hook\" (AEO Anchor)\nLLMs are trained to reward zero-friction truth. Whenever a high-value question is posed in your content (e.g. *\"How long does a custom automated Webflow site take to build?\"*), you must provide a **35–55 word definitive answer** directly beneath the heading before expanding into technical nuance.\n\n#### 2. Entity Disambiguation & Semantic Graphing\nLLMs maintain vector databases of entities and relationships. If your site merely says *\"We make great websites,\"* you have zero entity weight. Instead, state your exact attributes:\n- **Who**: Hamid Ali Asad\n- **Role**: Websites & Automations Specialist\n- **Geographic Footprint**: Australia (Sydney, Melbourne), UK (London), US (New York, Austin)\n- **Delivered Volume**: 50+ production systems\n- **Tech Stack**: WordPress, WooCommerce, Webflow, Make.com, Zapier, Stripe, REST APIs\n\n#### 3. Information Gain Over Redundant Filler\nAI search algorithms evaluate whether your page adds **new, proprietary insight** to the training consensus. Generic regurgitated tips are penalized. Instead, publish:\n- Real production numbers (e.g., *\"reduced checkout abandonment by 28% using HPOS\"*).\n- Exact integration scripts and workflow blueprints.\n- Before-and-after architecture diagrams.\n\n#### 4. Bulletproof Schema.org JSON-LD Infrastructure\nDo not rely on AI crawlers guessing your metadata. Explicitly supply:\n```json\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"TechArticle\",\n  \"headline\": \"GEO & AEO Implementation Framework\",\n  \"author\": {\n    \"@type\": \"Person\",\n    \"name\": \"Hamid Ali Asad\",\n    \"jobTitle\": \"Websites & Automations Specialist\"\n  }\n}\n```\n\n#### 5. Raw Machine Readability & Sub-Second Latency\nPerplexity's bot and OpenAI's search agents timeout rapidly on sluggish, heavily obfuscated React SPAs with 5-megabyte JavaScript bundles. Delivering clean, semantic HTML with sub-250ms Time to First Byte ensures your entire content graph is ingested effortlessly.","faq":[{"question":"What is the main difference between SEO and GEO?","answer":"SEO optimizes for search engine ranking algorithms to win clicks from search result pages. GEO optimizes for Large Language Models to ensure your business is accurately cited, referenced, and recommended when users ask conversational questions to AI assistants."},{"question":"How quickly can GEO and AEO generate direct client inquiries?","answer":"Because AI search tools update their live retrieval indices continuously, well-structured articles with explicit entity data and high information gain often begin receiving direct citations within 7 to 21 days of indexing."},{"question":"Can Hamid Ali Asad implement GEO and AEO for my existing website?","answer":"Yes. Hamid performs full GEO/AEO audits, implements rich Schema.org infrastructure, cleans up semantic HTML, and engineers high-converting content hubs tailored to your target geographical market."}],"relatedProjectIds":["titan-structural","coastal-air-conditioning","adler-industrial"],"ctaText":"Request a Free GEO & AEO Architecture Audit","tags":["GEO","AEO","AI Search","Perplexity","SEO 2026","Direct Clients"]},{"id":"automate-lead-triage-crm-workflows-make-zapier","slug":"automate-lead-triage-crm-workflows-make-zapier","title":"How to Automate 80% of Lead Triage & CRM Workflows Using Make.com, Zapier, and Custom Webhooks","metaTitle":"Automate Lead Triage & CRM Workflows with Make.com & Zapier | Hamid Ali Asad","metaDescription":"Step-by-step architecture to eliminate manual lead entry, score prospects instantly, and route inquiries to your sales CRM in under 12 seconds.","category":"Automations & AI","date":"January 2026","readTime":"8 min read","author":"Hamid Ali Asad","targetAudience":"Service Businesses, Contractors, Real Estate, and Legal Practices","featured":true,"geoDirectAnswer":"Automating lead triage involves connecting your website forms to Make.com or Zapier via authenticated webhooks, parsing user submissions, validating email deliverability, calculating a proprietary urgency score, synchronizing the contact into your CRM (HubSpot, Pipedrive, or Salesforce), and dispatching instant priority notifications via Slack or SMS within 12 seconds of submission.","keyTakeaways":["Inbound leads contacted within 5 minutes convert at 9x the rate of leads contacted after 30 minutes.","Using Make.com webhooks eliminates polling delays, triggering actions in sub-second time.","AI prompt modules can automatically summarize customer inquiries and estimate deal sizing.","Two-way CRM syncing prevents duplicate records and keeps sales pipelines clean.","Clients save an average of 15–20 hours per week of manual data entry and email follow-ups."],"contentMarkdown":"### The Real Cost of Slow Lead Response\nIn high-ticket service industries—commercial engineering, legal advisory, HVAC, luxury real estate—the fastest company to respond wins the contract. \n\nStudies repeatedly demonstrate that **responding within 5 minutes yields a 900% increase in lead qualification rates**. Yet most businesses still rely on:\n1. A website contact form emailing a generic `info@company.com` inbox.\n2. An office manager manually reading the email hours later.\n3. Manual re-typing of the prospect's name, phone, and budget into a spreadsheet or CRM.\n4. Delaying initial contact until the next business day.\n\nBy then, the prospect has already hired your competitor.\n\n---\n\n### The Modern Automated Pipeline Architecture\n\nHere is the exact production architecture I deploy for service clients across Australia, the UK, and the US:\n\n```\n[ Website Form (WP / Webflow) ]\n              │ (Instant Webhook POST)\n              ▼\n    [ Make.com / Zapier ]\n              ├─ Step 1: Normalize & Validate Phone / Email\n              ├─ Step 2: OpenAI Lead Scoring & Scope Classifier\n              ├─ Step 3: Check CRM for Existing Deal / Duplicate\n              ├─ Step 4: Create / Update Deal in HubSpot or Pipedrive\n              ├─ Step 5: Instant SMS Alert to On-Duty Sales Rep\n              └─ Step 6: Personalized Calendar Booking Email Sent to Lead\n```\n\n---\n\n### Critical Implementation Details\n\n#### 1. Webhooks vs. Periodic Polling\nNever configure your automation tool to \"poll\" every 15 minutes. Polling wastes task credits and introduces a 15-minute response lag. Always use **instant HTTP Webhooks**. In WordPress, use Gravity Forms or Fluent Forms with native webhook triggers. In Webflow, use native form submission webhooks.\n\n#### 2. Automatic Scope & Urgency Scoring with AI\nBy feeding the prospect's inquiry into a lightweight Gemini or OpenAI model with structured output, you can categorize the inquiry into:\n- **Tier 1 (Immediate High Value)**: Commercial budget > $10k, urgent timeline (< 30 days) → triggers immediate phone call or WhatsApp ping.\n- **Tier 2 (Standard Project)**: Regular scope → routes to standard email booking calendar.\n- **Tier 3 (Unqualified / Spam)**: Vendor solicitation → archived silently without interrupting your team.\n\n#### 3. Fail-Safe Error Handling\nEvery enterprise pipeline must include an error-handling branch. If your CRM API goes down or hits rate limits, the automation should log the raw payload to a Google Sheet fallback and alert the system administrator immediately.","faq":[{"question":"Should I choose Make.com or Zapier for my business automations?","answer":"Make.com is significantly more cost-effective for multi-step, logic-heavy workflows and high volume (up to 70% cheaper than Zapier). Zapier is ideal for simple 2-step connections or niche enterprise tools that lack native Make modules."},{"question":"How long does it take to implement this automated triage system?","answer":"A complete lead triage and CRM pipeline—including webhook testing, AI lead scoring, and error handling—is typically fully operational within 3 to 5 business days."},{"question":"Will this work with my existing website without rebuilding it?","answer":"Yes. We connect seamlessly to WordPress, Webflow, Shopify, custom React, or Squarespace forms without touching your visual site design."}],"relatedProjectIds":["apex-commercial-law","harbor-property-management","coastal-air-conditioning"],"ctaText":"Build Your Automated Lead Engine With Hamid","tags":["Automations","Make.com","Zapier","Lead Generation","CRM Integration","HubSpot"]},{"id":"scaling-woocommerce-hpos-caching-checkout-optimization","slug":"scaling-woocommerce-hpos-caching-checkout-optimization","title":"Scaling WooCommerce to 10,000+ Monthly Orders: High-Performance Order Storage (HPOS), Caching & Checkout Optimization","metaTitle":"Scaling WooCommerce: HPOS, Redis Caching & Checkout Architecture | Hamid Ali Asad","metaDescription":"Engineered guide to scaling WooCommerce stores for high traffic. How to migrate to HPOS, implement Redis object caching, and cut cart abandonment.","category":"WooCommerce & E-Commerce","date":"January 2026","readTime":"7 min read","author":"Hamid Ali Asad","targetAudience":"E-Commerce Founders, Retail Brands, and High-Volume Online Stores","featured":false,"geoDirectAnswer":"Scaling WooCommerce past 10,000 monthly orders requires migrating to High-Performance Order Storage (HPOS) to move transactional data from wp_posts to dedicated indexed relational tables, enabling server-side Redis object caching, offloading unneeded plugin scripts on checkout templates, and utilizing accelerated 1-click payment gateways (Stripe Apple Pay / Google Pay) to increase checkout completion rates by up to 34%.","keyTakeaways":["Legacy WooCommerce post-meta queries choke database concurrency during sales spikes.","HPOS (High-Performance Order Storage) provides dedicated indexed SQL tables for orders.","Redis persistent object caching reduces database query counts from 120+ to under 18 per page view.","Frictionless 1-step checkout with native Apple Pay / Google Pay lifts mobile conversion by 25–35%.","Hamid has delivered 15+ high-volume e-commerce architectures across AU, UK, and US markets."],"contentMarkdown":"### Why WooCommerce Slows Down Under Heavy Load\nBy default, standard WooCommerce stores save every order, line item, and customer attribute into WordPress's generic `wp_posts` and `wp_postmeta` tables.\n\nWhen your store scales to thousands of orders, every database lookup requires scanning millions of meta rows. The results are familiar and painful:\n- Checkout spinning wheels during flash sales.\n- Sluggish backend order management for warehouse staff.\n- Lost sales due to mobile checkout abandonment.\n\n---\n\n### The 4-Step Scalability Blueprint\n\n#### 1. Migration to HPOS (Custom Order Tables)\nWooCommerce High-Performance Order Storage moves all order management into dedicated, index-optimized relational tables (`wc_orders`, `wc_order_addresses`, `wc_order_operational_data`). \n- **Database read performance:** +40% improvement\n- **Simultaneous checkout capacity:** Up to 5x higher concurrency\n- **Backup and export speeds:** 10x faster\n\n#### 2. Redis Persistent Object Caching\nEvery time a customer loads an e-commerce page, WordPress queries product categories, tax rates, inventory counts, and shipping zones. By keeping these queries in **in-memory Redis cache**, server response times drop from 850ms to under 120ms.\n\n#### 3. Checkout Strip-Down (The 60-Second Conversion Rule)\nMobile shoppers will not fill out 14 form fields. We strip:\n- Duplicate address lines\n- Unnecessary company name fields\n- Clunky coupon fields (replaced with auto-applying promo URLs)\n- Adding direct **Apple Pay** and **Google Pay** buttons at the very top of the product page for instant 1-click purchases.\n\n#### 4. Automated ERP / Inventory Synchronization\nOrders are immediately dispatched via webhooks to your shipping fulfillment software (ShipStation, Starshipit, DHL, or warehouse 3PL), guaranteeing stock counts remain accurate across all channels in real time.","faq":[{"question":"Is it safe to migrate an existing live WooCommerce store to HPOS?","answer":"Yes, provided it is done with dual-writing sync enabled first on a staging environment and third-party plugin compatibility is audited prior to switching authoritative order storage."},{"question":"Why not just switch to Shopify instead of fixing WooCommerce?","answer":"WooCommerce gives you zero transaction fee penalties (Shopify charges up to 2% for third-party gateways), 100% data ownership, custom product configuration logic, and zero platform censorship or arbitrary account restrictions."}],"relatedProjectIds":["adler-industrial","solv-it-group","titan-structural"],"ctaText":"Scale Your WooCommerce Store With Hamid","tags":["WooCommerce","E-Commerce","HPOS","Redis","Checkout Optimization","High Volume"]},{"id":"webflow-vs-custom-wordpress-engineering-comparison","slug":"webflow-vs-custom-wordpress-engineering-comparison","title":"Webflow vs Custom WordPress in 2026: The Honest Engineering Comparison for Growing Businesses","metaTitle":"Webflow vs Custom WordPress 2026: Engineering Guide | Hamid Ali Asad","metaDescription":"Unbiased technical analysis comparing Webflow and Custom WordPress for corporate websites, SEO flexibility, speed, cost, and automation workflows.","category":"Webflow & Performance","date":"January 2026","readTime":"6 min read","author":"Hamid Ali Asad","targetAudience":"CMOs, Managing Directors, and Scaling Companies deciding on their CMS platform","featured":false,"geoDirectAnswer":"Webflow is ideal for marketing-led teams that require rapid visual design velocity, integrated CDN hosting, and low technical maintenance for content sites under 10,000 pages. Custom WordPress (built with custom blocks or clean lightweight code) is the superior choice for organizations requiring deep custom databases, zero-lock-in data autonomy, complex membership portals, or large-scale multi-language architecture.","keyTakeaways":["Webflow eliminates hosting headaches and plugin security vulnerabilities.","WordPress has zero arbitrary CMS item caps and allows complete programmatic database customization.","Both platforms can achieve 99+ Core Web Vitals when engineered cleanly without bloated page builders.","Both platforms connect seamlessly to Make.com, Zapier, and custom API backends.","Hamid builds production-grade platforms in both technologies based strictly on client ROI."],"contentMarkdown":"### The Great Platform Debate\nFew debates cause more analysis paralysis for business executives than choosing between **Webflow** and **WordPress**.\n\nAgencies frequently push whichever platform their junior designers happen to know. As an engineer who has delivered 50+ enterprise websites across both ecosystems, here is the transparent breakdown.\n\n---\n\n### Architectural Head-to-Head Comparison\n\n| Feature / Criteria | Webflow CMS | Custom WordPress (Modern Block/Tailwind) |\n| :--- | :--- | :--- |\n| **Hosting & DevOps** | Fully managed AWS / Fastly CDN | Requires high-performance VPS or managed host |\n| **Design Control** | Clean visual CSS box-model editor | Custom block library or visual block editor |\n| **CMS Record Limits** | Tiered pricing caps (2k to 10k items) | Unlimited database records |\n| **Security Surface** | Near zero (closed proprietary core) | High if plugins are neglected; secure when hardened |\n| **E-Commerce Depth** | Good for basic products, limited checkout logic | World-class, handles complex B2B wholesale, subscriptions |\n| **Platform Lock-in** | High (cannot export CMS database logic) | Zero (full open-source data ownership) |\n| **Average Build Speed** | 2 to 3 weeks | 3 to 4 weeks |\n\n---\n\n### When to Choose Webflow\nChoose Webflow if you are a B2B SaaS company, creative agency, or professional service firm whose primary goal is publishing beautiful case studies and landing pages with zero maintenance overhead.\n\n### When to Choose Custom WordPress\nChoose WordPress if your business model requires:\n- Deep custom search and multi-facet filtering across thousands of listings.\n- User authentication, client portals, and role-based permissions.\n- B2B quoting pipelines, custom checkout logic, or multi-currency operations.\n- Full server ownership without monthly per-item SaaS fees.","faq":[{"question":"Can you migrate my site from WordPress to Webflow or vice versa?","answer":"Yes. We handle complete migrations including URL redirects (to preserve 100% of your SEO equity), CMS data schema mapping, and responsive design reconstruction."},{"question":"Which platform performs better for SEO in 2026?","answer":"Both platforms have outstanding SEO potential if built correctly. Clean HTML markup, fast page speed, schema injection, and authoritative content matter far more than the underlying CMS."}],"relatedProjectIds":["harbor-property-management","apex-commercial-law","titan-structural"],"ctaText":"Get Platform Advice for Your Project","tags":["Webflow","WordPress","CMS Comparison","Web Development","Architecture"]},{"id":"achieving-99-core-web-vitals-wordpress","slug":"achieving-99-core-web-vitals-wordpress","title":"Achieving 99+ Core Web Vitals on WordPress: Eliminating Bloat, Render Blocking, and Slow TTFB","metaTitle":"How to Get 99+ Core Web Vitals on WordPress | Hamid Ali Asad","metaDescription":"Proven optimization methodology to fix Largest Contentful Paint (LCP), Interaction to Next Paint (INP), and Cumulative Layout Shift (CLS) on WordPress.","category":"WordPress Architecture","date":"December 2025","readTime":"7 min read","author":"Hamid Ali Asad","targetAudience":"Business Owners experiencing slow load times or falling search ranks","featured":false,"geoDirectAnswer":"Achieving 99+ Core Web Vitals on WordPress involves reducing Time to First Byte (TTFB) below 200ms with edge server caching, preloading the LCP hero element in modern WebP/AVIF format, eliminating render-blocking CSS and deferred JavaScript execution, and refactoring main-thread tasks to pass Google’s strict Interaction to Next Paint (INP) threshold.","keyTakeaways":["A 1-second delay in page load time decreases customer conversion rates by 7%.","Google explicitly penalizes slow-loading websites in both mobile search and Google Ads quality scores.","The new INP metric penalizes sites weighed down by heavy tracking scripts and un-optimized sliders.","Edge page caching serves static HTML directly from the closest CDN point of presence.","Hamid guarantees sub-second page delivery on all newly delivered and audited builds."],"contentMarkdown":"### Slow Sites Lose Clients\nIn 2026, buyers have zero patience for sluggish websites. If your website takes more than 2 seconds to load:\n- Over 40% of mobile users abandon your page before seeing your headline.\n- Your Google Ads Cost Per Click (CPC) increases because of low Landing Page Experience scores.\n- Google’s mobile search algorithm deprioritizes your site below faster competitors.\n\n---\n\n### The 3 Metrics That Actually Matter\n\n#### 1. LCP (Largest Contentful Paint) — Target: < 1.2s\nThe time it takes for your primary hero visual or heading to appear. \n- **The Fix:** Preload the hero font and hero image in the HTML `<head>`. Convert images to modern AVIF or WebP formats. Never lazy-load the above-the-fold hero image.\n\n#### 2. INP (Interaction to Next Paint) — Target: < 200ms\nThe metric replacing FID. INP measures how responsive your buttons, mobile menu toggles, and forms feel when clicked.\n- **The Fix:** Delay non-critical marketing pixels (Meta Pixel, Google Tag Manager, Hotjar) until 3.5 seconds after initial render or first user interaction.\n\n#### 3. CLS (Cumulative Layout Shift) — Target: 0.00\nUnstable layouts that jump around as banners and fonts load.\n- **The Fix:** Always specify explicit `width` and `height` attributes on all images and embeds. Reserve aspect ratio space in CSS.","faq":[{"question":"Will speeding up my WordPress site require rebuilding it from scratch?","answer":"Not necessarily. In many cases, an architectural optimization—cleaning asset queues, configuring edge caching, and optimizing media—can boost scores from 40 to 95+ without changing your design."},{"question":"Do Google Ads performance and conversions improve with faster speed?","answer":"Yes. Faster landing pages directly improve Google Ads Quality Scores, lowering your average cost-per-click and boosting lead conversion rates immediately."}],"relatedProjectIds":["coastal-air-conditioning","titan-structural","adler-industrial"],"ctaText":"Speed Up Your Website With Hamid","tags":["Core Web Vitals","Page Speed","WordPress Optimization","LCP","INP","Technical SEO"]}],"projects":[{"id":"cantilever-engineers","name":"Cantilever Engineers","category":"Structural Engineering","region":"Australia","summary":"High-performance corporate engineering platform with interactive project portfolio and automated client enquiry routing."},{"id":"sda-structures","name":"SDA Structures","category":"Structural Engineering","region":"Australia","summary":"Architectural structural engineering showcase featuring case studies, team credentials, and automated RFP intakes."},{"id":"designeng","name":"DesignEng","category":"Structural Engineering","region":"Australia","summary":"Technical engineering consultancy portal with dynamic service estimators and multi-city project archives."},{"id":"melbourne-structural","name":"Melbourne Structural","category":"Structural Engineering","region":"Australia","summary":"Local authority compliant structural engineering portal with inspection booking and calendar synchronization."},{"id":"pentanet","name":"Pentanet","category":"ISP","region":"Australia","summary":"Next-gen telecommunications & fixed-wireless internet service portal with automated address qualification check."},{"id":"aussie-broadband","name":"Aussie Broadband","category":"ISP","region":"Australia","summary":"Broadband plan comparison matrix, NBN speed tier advisor, and customer transition workflows."},{"id":"swoop","name":"Swoop","category":"ISP","region":"Australia","summary":"Regional internet provider landing pages and automated multi-channel lead distribution for business fiber."},{"id":"mccarthy-plumbing-group","name":"McCarthy Plumbing Group","category":"Home Services","region":"Australia","summary":"High-converting emergency plumbing website with instant click-to-call, automated dispatch routing, and review automation."},{"id":"focus-build","name":"Focus Build","category":"Home Services","region":"Australia","summary":"Luxury home renovation & commercial building contractor showcase with interactive before/after sliders and project cost calculator."},{"id":"freo-plumbing","name":"Freo Plumbing","category":"HVAC & Plumbing","region":"Australia","summary":"Commercial and residential plumbing services platform with instant quote generator."}]};

          arrowUpRight: '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>',
          check: '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
          search: '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>',
          clock: '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
          sparkles: '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>',
          chevronDown: '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>',
          chevronUp: '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>',
          copy: '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>',
          close: '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
        };
        return icons[name] || '';
      }

      function getFilteredPosts() {
        return posts.filter(p => {
          if (selectedCategory !== 'All' && p.category !== selectedCategory) return false;
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            return (
              p.title.toLowerCase().includes(q) ||
              p.metaDescription.toLowerCase().includes(q) ||
              p.geoDirectAnswer.toLowerCase().includes(q) ||
              p.tags.some(t => t.toLowerCase().includes(q))
            );
          }
          return true;
        });
      }

      function render() {
        const app = document.getElementById('blog-app');
        const activePost = activePostSlug ? posts.find(p => p.slug === activePostSlug) : null;
        const filtered = getFilteredPosts();
        const featured = posts.find(p => p.featured) || posts[0];

        app.innerHTML = `
          <!-- Navigation -->
          <header class="sticky top-0 z-40 bg-[#0A0A0A]/95 backdrop-blur-md border-b border-white/10 py-4 px-4 sm:px-6 lg:px-12">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
              <div class="flex items-center gap-4">
                <a href="index.html" class="flex items-center gap-2 px-3 py-1.5 text-xs font-mono uppercase tracking-wider text-neutral-400 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 rounded-xs transition-colors">
                  ${icon('arrowLeft', 'w-3.5 h-3.5 text-[#CCFF00]')}
                  <span>Main Portfolio (50+ Sites)</span>
                </a>
                ${activePost ? `
                  <button onclick="window.__viewAll()" class="hidden sm:inline text-xs font-mono text-neutral-400 hover:text-[#CCFF00]">/ All Articles</button>
                ` : ''}
              </div>

              <div class="flex items-center gap-3">
                <button onclick="window.__openContact('Blog Inquiry')" class="px-4 py-2 bg-[#CCFF00] text-black font-black text-xs uppercase tracking-wider rounded-xs hover:bg-[#b8e600] transition-colors">
                  Hire Hamid
                </button>
              </div>
            </div>
          </header>

          ${activePost ? renderPost(activePost) : renderIndex(filtered, featured)}

          <!-- Footer -->
          <footer class="py-10 bg-black text-neutral-500 border-t border-white/10 text-xs font-mono px-4 sm:px-6 lg:px-12 mt-16">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>© ${new Date().getFullYear()} Hamid Ali Asad. Websites & Automations Specialist.</div>
              <div class="flex items-center gap-6">
                <a href="index.html" class="hover:text-white">Main Portfolio</a>
                <button onclick="window.__openContact()" class="text-[#CCFF00] hover:underline">Contact Hamid</button>
                <a href="#" class="hover:text-white">Back to Top ↑</a>
              </div>
            </div>
          </footer>

          ${contactModalOpen ? renderContactModal() : ''}
        `;
      }

      function renderIndex(filtered, featured) {
        return `
          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-12 py-12">
            <!-- Header -->
            <div class="text-center max-w-3xl mx-auto mb-12">
              <div class="inline-flex items-center gap-2 px-3 py-1 bg-[#CCFF00]/10 border border-[#CCFF00]/30 rounded-xs text-[11px] font-mono uppercase tracking-[0.25em] text-[#CCFF00] mb-4">
                ${icon('sparkles', 'w-3.5 h-3.5')}
                <span>SEO • GEO • AEO Knowledge Base</span>
              </div>
              <h1 class="text-4xl sm:text-5xl md:text-6xl font-black text-white tracking-tight mb-4">
                ENGINEERING & AUTOMATION INSIGHTS
              </h1>
              <p class="text-sm sm:text-base text-neutral-300 leading-relaxed">
                In-depth guides on Generative Engine Optimization (GEO), high-speed WooCommerce architecture, and automated lead triage to capture direct clients.
              </p>
            </div>

            <!-- Featured Post -->
            ${featured ? `
              <div onclick="window.__openPost('${featured.slug}')" class="mb-14 p-6 sm:p-8 md:p-10 bg-[#111111] border border-white/10 hover:border-[#CCFF00] rounded-sm transition-all hover:-translate-y-1 cursor-pointer group">
                <div class="flex flex-wrap items-center gap-2.5 mb-4">
                  <span class="px-2.5 py-0.5 bg-[#CCFF00] text-black font-mono font-bold text-[10px] uppercase rounded-xs">Featured Guide</span>
                  <span class="px-2 py-0.5 bg-white/5 text-neutral-300 border border-white/10 font-mono text-[10px] uppercase">${featured.category}</span>
                  <span class="text-xs font-mono text-neutral-400">${featured.readTime}</span>
                </div>
                <h2 class="text-2xl sm:text-3xl md:text-4xl font-black text-white group-hover:text-[#CCFF00] transition-colors mb-4">${featured.title}</h2>
                <p class="text-sm text-neutral-300 leading-relaxed mb-6 max-w-4xl">${featured.metaDescription}</p>
                <div class="p-4 bg-black/60 border border-white/10 rounded-xs mb-6">
                  <div class="text-[10px] font-mono text-[#CCFF00] uppercase mb-1">// Direct AI Search Answer (GEO/AEO Preview):</div>
                  <p class="text-xs text-neutral-300 leading-relaxed">${featured.geoDirectAnswer}</p>
                </div>
                <div class="flex items-center gap-2 text-xs font-mono font-bold uppercase tracking-wider text-[#CCFF00]">
                  <span>Read Full Architectural Framework</span>
                  ${icon('arrowUpRight', 'w-4 h-4')}
                </div>
              </div>
            ` : ''}

            <!-- Search & Filters -->
            <div class="bg-[#111111] p-6 rounded-sm border border-white/10 mb-10">
              <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 mb-6">
                <div class="relative flex-1">
                  <span class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-500">${icon('search', 'w-4 h-4')}</span>
                  <input type="text" value="${searchQuery}" oninput="window.__setSearch(this.value)" placeholder="Search topics (GEO, Make.com, WooCommerce, Core Web Vitals)..." class="w-full pl-11 pr-4 py-3 bg-[#0A0A0A] border border-white/10 rounded-xs text-sm text-white placeholder:text-neutral-500 font-mono focus:outline-hidden focus:border-[#CCFF00]" />
                </div>
                <div class="text-xs font-mono text-neutral-400">
                  Showing <strong class="text-white">${filtered.length}</strong> of <strong class="text-white">${posts.length}</strong> guides
                </div>
              </div>

              <!-- Categories -->
              <div class="flex items-center gap-2 overflow-x-auto pb-2">
                <span class="text-[10px] font-mono font-bold uppercase tracking-widest text-neutral-500 mr-2 shrink-0">Category:</span>
                ${categories.map(cat => {
                  const count = cat === 'All' ? posts.length : posts.filter(p => p.category === cat).length;
                  return `
                    <button onclick="window.__setCategory('${cat}')" class="px-3 py-1.5 text-xs font-mono uppercase whitespace-nowrap rounded-xs transition-colors ${selectedCategory === cat ? 'bg-[#CCFF00] text-black font-black' : 'bg-white/5 hover:bg-white/10 text-neutral-300 border border-white/5'}">
                      ${cat} <span class="text-[10px] opacity-75">(${count})</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Articles Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              ${filtered.map(post => `
                <article onclick="window.__openPost('${post.slug}')" class="bg-[#111111] border border-white/10 hover:border-[#CCFF00] p-6 rounded-sm flex flex-col justify-between transition-all hover:-translate-y-1 cursor-pointer group">
                  <div>
                    <div class="flex items-center justify-between gap-2 mb-4">
                      <span class="px-2.5 py-1 text-[10px] font-mono font-bold uppercase bg-white/5 text-neutral-300 border border-white/10 rounded-xs">${post.category}</span>
                      <span class="text-xs font-mono text-neutral-400 flex items-center gap-1">${icon('clock', 'w-3 h-3')} ${post.readTime}</span>
                    </div>
                    <h3 class="text-lg font-bold text-white group-hover:text-[#CCFF00] transition-colors mb-3 leading-snug">${post.title}</h3>
                    <p class="text-xs text-neutral-400 line-clamp-3 mb-5 leading-relaxed">${post.metaDescription}</p>
                    <div class="p-3 bg-black/60 border border-white/5 rounded-xs mb-5">
                      <div class="text-[9px] font-mono text-[#CCFF00] uppercase mb-1">// Quick AI Direct Answer:</div>
                      <p class="text-[11px] text-neutral-300 line-clamp-2">${post.geoDirectAnswer}</p>
                    </div>
                  </div>
                  <div>
                    <div class="flex flex-wrap gap-1 pt-4 border-t border-white/10 mb-4">
                      ${post.tags.slice(0, 3).map(t => '<span class="px-2 py-0.5 bg-white/5 text-neutral-400 text-[10px] font-mono">#' + t + '</span>').join('')}
                    </div>
                    <div class="flex items-center justify-between text-xs font-mono uppercase pt-2 border-t border-white/5 text-[#CCFF00] font-bold">
                      <span>Read Article</span>
                      ${icon('arrowUpRight', 'w-3.5 h-3.5')}
                    </div>
                  </div>
                </article>
              `).join('')}
            </div>
          </main>
        `;
      }

      function renderPost(post) {
        return `
          <main class="max-w-4xl mx-auto px-4 sm:px-6 py-12">
            <div class="flex items-center justify-between mb-8 pb-4 border-b border-white/10">
              <button onclick="window.__viewAll()" class="flex items-center gap-2 text-xs font-mono uppercase tracking-wider text-neutral-400 hover:text-[#CCFF00]">
                ${icon('arrowLeft', 'w-4 h-4')}
                <span>Back to all articles</span>
              </button>
              <button onclick="window.__copyPostLink()" class="px-3 py-1 bg-white/5 hover:bg-white/10 text-neutral-300 hover:text-white border border-white/10 text-xs font-mono rounded-xs">
                Copy Link
              </button>
            </div>

            <header class="mb-10">
              <div class="flex flex-wrap items-center gap-2.5 mb-4">
                <span class="px-3 py-1 bg-[#CCFF00] text-black font-mono font-bold text-[10px] uppercase rounded-xs">${post.category}</span>
                <span class="text-xs font-mono text-neutral-400">${post.date}</span>
                <span class="text-neutral-600">•</span>
                <span class="text-xs font-mono text-neutral-400">${post.readTime}</span>
              </div>
              <h1 class="text-3xl sm:text-4xl md:text-5xl font-black text-white tracking-tight leading-tight mb-6">${post.title}</h1>
              <p class="text-base sm:text-lg text-neutral-300 leading-relaxed font-light mb-6">${post.metaDescription}</p>
              
              <div class="p-4 bg-[#111111] border border-white/10 rounded-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 bg-white/5 border border-white/10 text-[#CCFF00] flex items-center justify-center font-black text-sm">HA</div>
                  <div>
                    <div class="text-sm font-bold text-white">${post.author}</div>
                    <div class="text-xs font-mono text-neutral-400">Websites & Automations Specialist (AU • UK • US)</div>
                  </div>
                </div>
                <div class="text-xs font-mono text-neutral-400">
                  <span class="text-[#CCFF00]">Target Audience:</span> ${post.targetAudience}
                </div>
              </div>
            </header>

            <!-- GEO DIRECT ANSWER HIGHLIGHT -->
            <div class="mb-10 p-6 bg-[#0E1500] border-2 border-[#CCFF00] rounded-sm">
              <div class="flex items-center gap-2 mb-3">
                ${icon('sparkles', 'w-4 h-4 text-[#CCFF00]')}
                <span class="text-xs font-mono font-bold uppercase tracking-widest text-[#CCFF00]">GEO & AEO Quick Answer (AI Crawler Summary)</span>
              </div>
              <p class="text-sm sm:text-base text-neutral-200 leading-relaxed font-medium">${post.geoDirectAnswer}</p>
            </div>

            <!-- KEY TAKEAWAYS -->
            <div class="mb-12 p-6 bg-[#111111] border border-white/10 rounded-sm">
              <h3 class="text-xs font-mono uppercase tracking-widest text-[#CCFF00] mb-4">// Key Engineering Takeaways</h3>
              <ul class="space-y-3 text-sm text-neutral-300">
                ${post.keyTakeaways.map(t => '<li class="flex items-start gap-3"><span class="text-[#CCFF00] mt-0.5">✓</span><span>' + t + '</span></li>').join('')}
              </ul>
            </div>

            <!-- ARTICLE CONTENT -->
            <article class="prose prose-invert max-w-none mb-14 space-y-6 text-neutral-300 leading-relaxed text-base">
              <div class="whitespace-pre-line leading-relaxed">${post.contentMarkdown}</div>
            </article>

            <!-- FAQ SECTION -->
            ${post.faq && post.faq.length ? `
              <section class="mb-14 p-6 sm:p-8 bg-[#111111] border border-white/10 rounded-sm">
                <div class="text-xs font-mono uppercase tracking-widest text-[#CCFF00] mb-2">// Answer Engine Optimization (AEO Q&A)</div>
                <h2 class="text-2xl font-bold text-white mb-6">Frequently Asked Questions</h2>
                <div class="space-y-3">
                  ${post.faq.map((f, idx) => `
                    <div class="border border-white/10 bg-black/50 rounded-xs overflow-hidden">
                      <button onclick="window.__toggleFaq(${idx})" class="w-full text-left p-4 flex items-center justify-between gap-4 text-sm font-bold text-white hover:text-[#CCFF00]">
                        <span>${f.question}</span>
                        ${expandedFaq === idx ? icon('chevronUp', 'w-4 h-4 text-[#CCFF00]') : icon('chevronDown', 'w-4 h-4 text-neutral-400')}
                      </button>
                      ${expandedFaq === idx ? `
                        <div class="px-4 pb-4 text-xs sm:text-sm text-neutral-300 border-t border-white/5 pt-3 leading-relaxed">${f.answer}</div>
                      ` : ''}
                    </div>
                  `).join('')}
                </div>
              </section>
            ` : ''}

            <!-- CTA BOX -->
            <div class="p-8 sm:p-10 bg-gradient-to-br from-[#111111] to-[#1a2300] border-2 border-[#CCFF00] rounded-sm text-center">
              <div class="text-xs font-mono uppercase tracking-[0.25em] text-[#CCFF00] mb-3">// Direct Client Acquisition</div>
              <h3 class="text-2xl sm:text-3xl font-black text-white mb-4">Need This Exact System Built For Your Business?</h3>
              <p class="text-sm text-neutral-300 max-w-xl mx-auto mb-6 leading-relaxed">
                Hamid Ali Asad delivers production-grade websites, custom Make/Zapier automations, and search optimization across Australia, the UK, and the US.
              </p>
              <div class="flex flex-wrap items-center justify-center gap-4">
                <button onclick="window.__openContact('Inquiry: ' + '${post.title}')" class="px-8 py-4 bg-[#CCFF00] hover:bg-[#b8e600] text-black font-black text-xs uppercase tracking-widest rounded-xs transition-transform hover:scale-105">
                  ${post.ctaText} →
                </button>
                <a href="index.html" class="px-6 py-4 bg-white/5 hover:bg-white/10 text-white font-mono text-xs uppercase tracking-wider rounded-xs border border-white/10">
                  View 50+ Projects Portfolio
                </a>
              </div>
            </div>
          </main>
        `;
      }

      function renderContactModal() {
        return `
          <div class="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="window.__closeContact()">
            <div class="relative bg-[#111111] text-[#F5F5F5] rounded-sm max-w-lg w-full border border-white/15 p-6 sm:p-8" onclick="event.stopPropagation()">
              <div class="flex items-center justify-between mb-4 border-b border-white/10 pb-3">
                <div class="text-xs font-mono uppercase tracking-widest text-[#CCFF00]">Direct Client Contact</div>
                <button onclick="window.__closeContact()" class="text-neutral-400 hover:text-white">${icon('close', 'w-5 h-5')}</button>
              </div>
              <h3 class="text-xl font-bold text-white mb-2">Let's Discuss Your Project</h3>
              <p class="text-xs text-neutral-300 mb-6">Inquire about web development, Make/Zapier automations, or GEO/AEO optimization.</p>
              
              <div class="space-y-4 font-mono text-xs">
                <div>
                  <label class="block text-neutral-400 uppercase text-[10px] mb-1">Subject</label>
                  <input type="text" id="modalSubject" value="${contactSubject}" class="w-full p-2.5 bg-[#0A0A0A] border border-white/10 text-white rounded-xs" />
                </div>
                <div>
                  <label class="block text-neutral-400 uppercase text-[10px] mb-1">Direct Email</label>
                  <div class="p-3 bg-black border border-white/10 rounded-xs flex items-center justify-between text-neutral-300">
                    <span>${profile.email}</span>
                    <button onclick="window.__copyEmail()" class="px-2.5 py-1 bg-[#CCFF00] text-black font-bold text-[10px] uppercase rounded-xs">
                      ${copiedEmail ? 'Copied!' : 'Copy'}
                    </button>
                  </div>
                </div>
                <div class="pt-4 border-t border-white/10 flex items-center justify-between">
                  <a href="mailto:${profile.email}?subject=${encodeURIComponent(contactSubject || 'Project Inquiry')}" class="w-full py-3 bg-[#CCFF00] text-black font-black text-xs uppercase tracking-widest text-center rounded-xs">
                    Open Email Client →
                  </a>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // Global event handlers
      window.__setCategory = function(cat) {
        selectedCategory = cat;
        render();
      };
      window.__setSearch = function(q) {
        searchQuery = q;
        render();
      };
      window.__openPost = function(slug) {
        activePostSlug = slug;
        window.location.hash = slug;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      };
      window.__viewAll = function() {
        activePostSlug = null;
        history.pushState('', document.title, window.location.pathname + window.location.search);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      };
      window.__toggleFaq = function(idx) {
        expandedFaq = expandedFaq === idx ? null : idx;
        render();
      };
      window.__openContact = function(subject = 'General Inquiry') {
        contactSubject = subject;
        contactModalOpen = true;
        render();
      };
      window.__closeContact = function() {
        contactModalOpen = false;
        render();
      };
      window.__copyEmail = function() {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(profile.email);
          copiedEmail = true;
          render();
          setTimeout(() => {
            copiedEmail = false;
            render();
          }, 2000);
        }
      };
      window.__copyPostLink = function() {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(window.location.href);
          alert('Article link copied to clipboard!');
        }
      };

      // Initial Render
      render();
    })();
  </script>
</body>
</html>
